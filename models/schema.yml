
version: 2

sources:
   - name: gz_raw_data
     database: project-dbt-manuela
     schema: gz_raw_data
     loader: bigquery
     tables:
       - name: sales
         identifier : raw_gz_sales
         description: sales of Greenweez / we have on row per product_id found in each orders_id
         columns :
          - name: date_date
            description: date de commande
          - name: orders_id
            description: orders id
          - name: products_id
            description: products id
          - name: revenue
            description: revenue pour un produit 
          - name: quantity
            description: quantity de produits
       - name: product
         identifier : raw_gz_product
         description: products of Greenweez / we have a row per product_id and the purchase_price
         columns : 
          - name: products_id
            description: products id
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: purchase price
       - name: ship
         identifier : raw_gz_ship
         description: ship of Greenweez / we have on row per orders_id and shipping info
         columns :
          - name: orders_id
            description: orders id
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: shipping fee
          - name: logcost
            description: logcost
          - name: ship_cost
            description: ship cost
       - name: adwords
         identifier : raw_gz_adwords
         description: adwords campaigns of Greenweez / we have on row per date_date for a campaign_key
         tests:
             - unique:
                 column_name: "(date_date || '-' || campaign_key)"            
         columns :       
          - name: date_date
            description: date 
            tests: 
              - not_null  
          - name: paid_source
            description: entreprise de campagne pub 
            tests: 
              - not_null   
          - name: campaign_key
            description: campaign_key 
            tests: 
              - not_null   
          - name: campaign_name
            description: campaign_name
            tests: 
              - not_null        
          - name: ads_cost
            description: ads cost
            tests: 
              - not_null     
          - name: impression
            description: impression
            tests: 
              - not_null 
          - name: click
            description: click
            tests: 
              - not_null            
